# Dev Harness Constitution — V7 Config Schema
#
# Top-level configuration for the Dev Harness.
# See V7 §7 for full config schema specification.

project: dev-harness
version: "1.0"

# Enforcement configuration — global default for boundary test enforcement
# Per-session-type `enforce_boundary_tests:` overrides this global when set.
boundary_test_enforcement_default: true

# Session type configuration
session_types:
  greenfield:
    enforce_boundary_tests: false
    guidance: "Build new features without backward compatibility constraints."
  refactoring:
    enforce_boundary_tests: true
    guidance: "Preserve existing interfaces. First wave must be boundary tests."
  get-well:
    enforce_boundary_tests: true
    guidance: "Fix broken tests first. Boundaries may be restructured with explicit override."
