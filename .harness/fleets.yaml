# Agent Fleet Configuration

fleets:
  default:
    agents: [coder]
    description: "Single-coder fleet for straightforward implementation tasks"
    roles:
      coder:
        model: deepseek-v4-flash
        timeout: 300

  standard:
    agents: [architect, coder, reviewer]
    description: "Full lifecycle fleet with architect planning, coder implementation, and reviewer quality gate"
    roles:
      architect:
        model: deepseek-v4-pro
        timeout: 600
      coder:
        model: deepseek-v4-flash
        timeout: 600
      reviewer:
        model: deepseek-v4-pro
        timeout: 300
    workflow:
      phases:
        - architect: design
        - coder: implement
        - reviewer: review
        - architect: approve

  consultation:
    agents: [architect, coder]
    description: "Architect-led consultation for design decisions with optional coder validation"
    roles:
      architect:
        model: deepseek-v4-pro
        timeout: 600
      coder:
        model: deepseek-v4-flash
        timeout: 300
