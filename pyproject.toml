[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dev-harness"
version = "0.1.0"
description = "Agent orchestration system for software development"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Proprietary — internal use only"}
keywords = ["agent", "orchestration", "development", "harness"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "pyyaml>=6.0",
    "aiofiles>=23.0",
    "jinja2>=3.1",
    "rich>=13.0",
    "httpx>=0.24",
    "click>=8.0",
    "temporalio>=1.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.3",
    "build>=1.0",
    "click>=8.0",
    "pyyaml>=6.0",
]

[project.scripts]
harness = "harness.entry:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["src/harness"]
omit = ["*/__pycache__/*", "*/.tox/*", "*/venv/*", "*.egg-info/*"]

[tool.coverage.report]
fail_under = 70
skip_covered = true
skip_empty = true
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.coverage.html]
directory = "coverage/"

[tool.setuptools.packages.find]
where = ["src"]
include = ["harness*"]

[tool.setuptools.package-data]
"harness" = ["**/*.yaml", "**/*.j2", "**/*.md"]

[tool.ruff]
line-length = 90
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "N", "RUF100"]
# Rules we'll enforce gradually (currently too many pre-existing issues):
#   UP   — pyupgrade suggestions (cosmetic, mostly redundant object())
#   SIM  — simplification (style preference, not bugs)
#   ARG  — unused args (legitimate in tests for fixture contracts)
#   E501 — line length (legitimate in long string literals)
#
# CI enforces the selected rules above. Run locally with:
#   ruff check src/harness/       # stricter on source
#   ruff check tests/ --ignore E501,UP,ARG  # lenient on tests

[tool.ruff.lint.per-file-ignores]
# Tests: ignore cosmetic rules that are part of test patterns
"tests/*" = [
    "E402",   # module-level imports after classes (lazy imports)
    "E501",   # long test data strings
    "UP",     # pyupgrade (optional)
    "ARG",    # unused args (fixtures like tmp_path by contract)
    "I001",   # import ordering (cosmetic)
    "F401",   # unused imports (pre-existing, cleanup later)
    "F841",   # unused variables (documentation assignments)
    "F811",   # re-import for local scope testing
    "N806",   # MockXxx naming in context managers
    "B017",   # assert Exception in tests
    "B904",   # raise from detail
    "F621",   # minor
    "E741",   # ambiguous variable name
    "SIM117", # nested with statements
    "SIM222", # simplification
    "SIM300", # yoda condition
    "F821",   # asyncio undefined in local scope
    "ARG001", # unused function args
]
"src/harness/*" = [
    "E501",   # long lines in data/code strings (cosmetic)
    "UP",     # pyupgrade (optional, will fix gradually)
    "B904",   # raise from detail (many pre-existing, will fix gradually)
    "B007",   # loop control variable not used (minor)
    "F841",   # unused variables (many pre-existing, will fix gradually)
    "F811",   # redefinition (Click command naming, will fix gradually)
    "E741",   # ambiguous variable name (cosmetic)
    "I001",   # import ordering (cosmetic)
    "ARG002", # unused method args (interface stubs)
    "N806",   # uppercase naming for constants (cosmetic)
    "N817",   # acronym imports (cosmetic, will fix gradually)
    "F401",   # unused imports in __init__.py (re-exported symbols)
    "E402",   # module-level imports after constants (cosmetic)
    "W293",   # blank line whitespace (cosmetic)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
