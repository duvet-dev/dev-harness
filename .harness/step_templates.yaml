# Dev Harness Step Templates Configuration
#
# Reusable step blueprints referenced by name during phase execution.
# Templates reference teams or agents (mutually exclusive).
# See V7 §7 (Config Schema) and §10.5.

step_templates:
  - name: comprehensive-arch-review
    description: "Full architectural review by the architecture team"
    team: architecture
    output: consolidated-review
    parallel: true

  - name: quick-security-scan
    description: "Targeted security review by the security critic"
    agents: ["security-critic"]
    output: security-report

  - name: full-code-review
    description: "Complete code review by the review team"
    team: review
    output: full-review-report
    parallel: true

  - name: build-and-test
    description: "Full implementation with testing by the coding team"
    team: coding
    output: implementation-with-tests

  - name: validate-requirements
    description: "Validate implementation against requirements"
    team: validation
    output: validation-report

  - name: research-and-discovery
    description: "Research phase using discovery team"
    team: discovery
    output: research-findings
    parallel: true

  - name: boundary-test
    description: "Generate boundary tests for existing interfaces"
    agents: ["boundary-test-agent"]
    output: boundary-tests

  - name: dead-code-analysis
    description: "Analyse codebase for dead code"
    agents: ["dead-code-analyser"]
    output: dead-code-report

  - name: component-analysis
    description: "Analyse component dependencies and structure"
    agents: ["component-analyser"]
    output: component-report
