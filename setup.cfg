[metadata]
name = dev-harness
version = 0.1.0
description = Agent orchestration system for software development

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9
install_requires =
    pyyaml>=6.0
    aiofiles>=23.0
    jinja2>=3.1
    rich>=13.0
    httpx>=0.24

[options.packages.find]
where = src
include = harness*

[options.package_data]
harness =
    **/*.yaml
    **/*.j2
    **/*.md

[options.entry_points]
console_scripts =
    harness = harness.entry:main
